<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" role="img" aria-labelledby="title desc">
<title id="title">Agentic Everything 宏观架构</title>
<desc id="desc">现有开发智能体通过 AE Skill MCP CLI 理解各类客户项目、业务与适合的 Agentic 化程度，归档改造前黑盒基线，生成定制计划，经批准改造后做输出与副作用对拍，再集中审阅默认关闭的改善开关。客户保持原技术栈，嵌入 Agentic tab 和助手，连接独立 TypeScript 控制面与运行面。宿主保留身份权限及业务真源，AE 保存运行审批账本。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516273"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#152433}.title{font-size:36px;font-weight:700}.subtitle{font-size:20px;fill:#526171}.section{font-size:25px;font-weight:700}.label{font-size:24px;font-weight:600}.body{font-size:20px;fill:#354658}.note{font-size:18px;fill:#526171}.line{fill:none;stroke:#516273;stroke-width:2.5;marker-end:url(#arrow)}.group{fill:#f5f7fa;stroke:#c9d3df;stroke-width:1.5}.box{fill:#fff;stroke:#bdcbd9;stroke-width:1.5}</style>
<rect width="1600" height="1480" fill="#fff"/>
<text x="50" y="60" class="title">Agentic Everything 宏观架构</text>
<text x="50" y="96" class="subtitle">已批准的产品架构 · AE TypeScript 核心 · 客户宿主保持原语言与业务权限</text>
<rect x="40" y="125" width="1520" height="465" rx="12" class="group"/>
<text x="65" y="166" class="section">改造域  由客户现有开发智能体执行</text>
<rect x="65" y="195" width="330" height="145" rx="12" class="box"/>
<text x="87" y="233" class="label">各类客户软件</text>
<text x="87" y="267" class="body">源码、业务目标与原有测试</text>
<text x="87" y="296" class="body">不要求迁移宿主技术栈</text>
<rect x="445" y="195" width="330" height="145" rx="12" class="box"/>
<text x="467" y="233" class="label">AE Skill / MCP / CLI</text>
<text x="467" y="267" class="body">理解项目、采集改前行为</text>
<text x="467" y="296" class="body">隔离输入、输出与副作用基线</text>
<rect x="825" y="195" width="330" height="145" rx="12" class="box"/>
<text x="847" y="233" class="label">专属改造计划与批准</text>
<text x="847" y="267" class="body">改造程度、能力、文件、验收</text>
<text x="847" y="296" class="body">绑定计划、源码与基线 hash</text>
<rect x="1205" y="195" width="330" height="145" rx="12" class="box"/>
<text x="1227" y="233" class="label">隔离改造与候选运行</text>
<text x="1227" y="267" class="body">改善开关默认 OFF</text>
<text x="1227" y="296" class="body">相同输入与状态，保留原语义</text>
<path d="M 395 268 L 442 268" class="line"/>
<path d="M 775 268 L 822 268" class="line"/>
<path d="M 1155 268 L 1202 268" class="line"/>
<rect x="65" y="390" width="400" height="120" rx="12" class="box"/>
<text x="87" y="428" class="label">改造前基线档案</text>
<text x="87" y="462" class="body">输入 / 输出 / 副作用，可回放</text>
<text x="87" y="491" class="body">固定版本、hash、脱敏与覆盖</text>
<rect x="600" y="390" width="400" height="120" rx="12" class="box"/>
<text x="622" y="428" class="label">差异对拍与安全门禁</text>
<text x="622" y="462" class="body">OFF 一致 / ON 预期差异</text>
<text x="622" y="491" class="body">未受影响用例仍须全部通过</text>
<rect x="1135" y="390" width="400" height="120" rx="12" class="box"/>
<text x="1157" y="428" class="label">集中审阅与可逆交付</text>
<text x="1157" y="462" class="body">默认 OFF，最终批量选择改善</text>
<text x="1157" y="491" class="body">选择组合复验，归档报告与回退</text>
<path d="M 610 340 L 610 365 L 265 365 L 265 387" class="line"/>
<path d="M 1370 340 L 1370 365 L 800 365 L 800 387" class="line"/>
<path d="M 465 450 L 597 450" class="line"/>
<path d="M 1000 450 L 1132 450" class="line"/>
<text x="65" y="565" class="note">OFF 保持原业务语义；ON 仅预声明差异可通过；安全、授权与数据完整性问题不能作为兼容开关。</text>
<path d="M 1335 510 L 1335 625 L 270 625 L 270 650" class="line"/>
<text x="600" y="616" class="note">交付到宿主与 AE，不改变宿主业务真源</text>
<rect x="40" y="655" width="420" height="610" rx="12" class="group"/>
<text x="65" y="696" class="section">客户宿主</text>
<rect x="510" y="655" width="430" height="610" rx="12" class="group"/>
<text x="535" y="696" class="section">AE 嵌入表面</text>
<rect x="990" y="655" width="570" height="610" rx="12" class="group"/>
<text x="1015" y="696" class="section">AE TypeScript 核心</text>
<rect x="65" y="725" width="370" height="120" rx="12" class="box"/>
<text x="87" y="763" class="label">原业务入口</text>
<text x="87" y="797" class="body">页面 / App / 小程序 / API / CLI</text>
<text x="87" y="826" class="body">保留原业务流，按项目增加能力</text>
<rect x="65" y="895" width="370" height="110" rx="12" class="box"/>
<text x="87" y="933" class="label">既有身份与权限</text>
<text x="87" y="967" class="body">登录、租户、角色、资源 ACL</text>
<rect x="65" y="1070" width="370" height="125" rx="12" class="box"/>
<text x="87" y="1108" class="label">宿主业务 API / SDK</text>
<text x="87" y="1142" class="body">最终鉴权与业务事务</text>
<text x="87" y="1171" class="body">operationId、幂等、执行回执</text>
<rect x="535" y="725" width="380" height="120" rx="12" class="box"/>
<text x="557" y="763" class="label">Agentic tab / Console</text>
<text x="557" y="797" class="body">能力与助手配置、测试和发布</text>
<text x="557" y="826" class="body">同一控制面，不复制配置</text>
<rect x="535" y="895" width="380" height="110" rx="12" class="box"/>
<text x="557" y="933" class="label">助手 / API / CLI 入口</text>
<text x="557" y="967" class="body">上下文、预览、确认、进度</text>
<rect x="535" y="1070" width="380" height="125" rx="12" class="box"/>
<text x="557" y="1108" class="label">Host Adapter / 平台桥</text>
<text x="557" y="1142" class="body">显式 context、导航和页面更新</text>
<text x="557" y="1171" class="body">浏览器上报不构成授权</text>
<rect x="1015" y="725" width="520" height="120" rx="12" class="box"/>
<text x="1037" y="763" class="label">控制面</text>
<text x="1037" y="797" class="body">Registry · AgentRelease · Policy</text>
<text x="1037" y="826" class="body">连接器、预算、评测、版本 pin</text>
<rect x="1015" y="895" width="520" height="110" rx="12" class="box"/>
<text x="1037" y="933" class="label">运行面与持久执行</text>
<text x="1037" y="967" class="body">可信会话 · AgentRuntime · DBOS</text>
<rect x="1015" y="1070" width="520" height="125" rx="12" class="box"/>
<text x="1037" y="1108" class="label">ToolBroker 与受控 adapters</text>
<text x="1037" y="1142" class="body">权限、审批、幂等、未知结果核对</text>
<text x="1037" y="1171" class="body">HTTP / MCP / 平台与 egress 策略</text>
<path d="M 435 785 L 505 785 L 532 785" class="line"/>
<path d="M 480 785 L 480 950 L 532 950" class="line"/>
<path d="M 915 785 L 1012 785" class="line"/>
<path d="M 915 950 L 1012 950" class="line"/>
<path d="M 1275 845 L 1275 892" class="line"/>
<path d="M 1275 1005 L 1275 1067" class="line"/>
<path d="M 250 1005 L 250 1038 L 1100 1038 L 1100 1008" class="line"/>
<text x="470" y="1031" class="note">宿主服务端交换短期、最小范围的身份</text>
<path d="M 1275 1195 L 1275 1238 L 250 1238 L 250 1198" class="line"/>
<text x="535" y="1228" class="note">受权业务调用与回执，不绕过原系统权限</text>
<rect x="40" y="1300" width="1520" height="120" rx="12" class="group"/>
<text x="65" y="1338" class="section">AE 数据与运营</text>
<text x="65" y="1376" class="body">PostgreSQL：配置 / release / run / approval / invocation / outbox    ｜    凭据只存引用    ｜    业务审计与遥测分离</text>
<path d="M 1465 1195 L 1465 1297" class="line"/>
<text x="50" y="1460" class="note">边界：Skill/MCP 不是授权系统；checkpoint 不等于外部写入 exactly-once；支持按具体 recipe 与业务验收确认。</text>
</svg>